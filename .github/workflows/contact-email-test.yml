name: One-time Resend contact verification

on:
  push:
    paths:
      - ".github/workflows/contact-email-test.yml"

jobs:
  verify-contact-email:
    runs-on: ubuntu-latest
    steps:
      - name: Submit controlled production lead
        shell: bash
        run: |
          set -euo pipefail
          response=$(curl --fail-with-body -sS -X POST 'https://rukhlabs.com/api/contact' \
            -H 'Origin: https://rukhlabs.com' \
            -H 'Content-Type: application/json' \
            --data '{"name":"Rukh Labs Resend Verification","email":"test-contact@rukhlabs.com","reason":"Something else","message":"Controlled production verification of immediate Rukh Labs Resend lead notifications after environment configuration.","sourcePage":"/contact","referrer":"","utm":{}}')
          echo "API_RESPONSE=$response"
          echo "$response" | grep -q '"notificationSent":true'
