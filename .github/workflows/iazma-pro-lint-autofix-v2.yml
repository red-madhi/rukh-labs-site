name: Guarded IAZMA PRO lint repair

on:
  push:
    branches:
      - feat/iazma-pro-guided-network-story

permissions:
  contents: write

jobs:
  repair:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Check out branch
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Recover and run the guarded repair script
        shell: bash
        run: |
          python <<'PY'
          import base64
          import gzip
          import re
          from pathlib import Path

          source = Path('.github/workflows/iazma-pro-lint-autofix.yml').read_text(encoding='utf-8')
          match = re.search(r"echo '([^']+)' \| base64", source)
          if not match:
              raise SystemExit('Repair payload was not found.')
          payload = match.group(1)
          payload += '=' * (-len(payload) % 4)
          decoded = base64.b64decode(payload, validate=False)
          Path('/tmp/iazma_repair.py').write_bytes(gzip.decompress(decoded))
          print(f'Recovered {len(decoded)} compressed bytes.')
          PY
          python /tmp/iazma_repair.py
          rm .github/workflows/iazma-pro-lint-autofix-v2.yml
          git diff --check

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies
        run: npm install --no-audit --no-fund

      - name: Verify lint
        run: npm run lint

      - name: Commit repairs
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Fix IAZMA PRO React lint issues"
          git push origin HEAD:${GITHUB_REF_NAME}
