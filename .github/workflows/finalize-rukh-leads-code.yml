name: Finalize and verify Rukh Leads crawler code

on:
  push:
    paths:
      - ".github/workflows/finalize-rukh-leads-code.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  finalize:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - name: Route the production pipeline through the free-credit-aware discovery worker
        run: |
          python3 - <<'PY'
          from pathlib import Path
          path = Path('src/app/api/leads/collect/pipeline-v3/route.ts')
          text = path.read_text()
          text = text.replace('/api/leads/collect/discover-v2', '/api/leads/collect/discover-v3')
          path.write_text(text)
          PY
      - name: Remove superseded crawler routes
        run: |
          git rm -r --ignore-unmatch \
            src/app/api/leads/collect/discover-domains \
            src/app/api/leads/collect/discover \
            src/app/api/leads/collect/discover-v2 \
            src/app/api/leads/collect/pipeline \
            src/app/api/github-crawl
      - uses: pnpm/action-setup@v4
        with:
          version: 10
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm build
      - name: Record verification and commit the finalized code
        run: |
          printf 'Rukh Leads crawler finalized and production build verified at %s\n' "$(date -u +%FT%TZ)" > .github/rukh-leads-final-build-verified.txt
          git rm .github/workflows/finalize-rukh-leads-code.yml
          git add src/app/api/leads/collect/pipeline-v3/route.ts .github/rukh-leads-final-build-verified.txt
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "Finalize and verify Rukh Leads crawler code"
          git push origin HEAD:main
