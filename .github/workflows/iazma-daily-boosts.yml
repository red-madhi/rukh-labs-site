name: IAZMA Daily Boosts

on:
  schedule:
    # Offset from the busiest part of the hour. The endpoint owns its Denver-
    # time due check and daily idempotency, so hourly retries are safe.
    - cron: "17 14-23 * * *"
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - ".github/workflows/iazma-daily-boosts.yml"

permissions:
  contents: read
  id-token: write

concurrency:
  group: iazma-daily-boosts
  cancel-in-progress: false

jobs:
  prepare:
    runs-on: ubuntu-latest
    timeout-minutes: 4
    steps:
      - name: Prepare picks and send approval email
        run: |
          TOKEN=$(curl -fsS -H "Authorization: bearer $ACTIONS_ID_TOKEN_REQUEST_TOKEN" "${ACTIONS_ID_TOKEN_REQUEST_URL}&audience=rukhlabs.com" | jq -r .value)
          test -n "$TOKEN" -a "$TOKEN" != "null"
          URL="https://rukhlabs.com/api/advanced-network/daily-boosts/prepare"
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            URL="$URL?force=1"
          fi
          curl --fail --silent --show-error --retry 3 --retry-delay 5 \
            --max-time 90 \
            -H "Authorization: Bearer $TOKEN" "$URL"
