name: Apply outreach safety bundle

on:
  pull_request:
    branches:
      - main
    types: [opened, synchronize, reopened]

permissions:
  contents: write

concurrency:
  group: apply-outreach-safety-bundle
  cancel-in-progress: false

jobs:
  apply:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Check out feature branch
        uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref || github.ref_name }}
          fetch-depth: 0

      - name: Reconstruct and verify source bundle
        env:
          GH_TOKEN: ${{ github.token }}
          BLOB_SHAS: >-
            af0a55cd2b4a9de30014f3b2afda374a93a43a37
            fc9b6f3278e51f1c15561c12e2d3e7231bdb0da9
            017b957b08f323442a3732c492ed4f9f82e96b8d
            fa8e7f4215c23e6affa29e91f36d15cba891e305
            379e86c0f36ab381edc47b746ceb3c8702808560
            13d1d2087685fcc6b9ebaa442a9afd6c25ce6031
        run: |
          set -euo pipefail
          : > /tmp/rukh-bundle.b64
          for sha in $BLOB_SHAS; do
            curl --fail --silent --show-error \
              -H "Authorization: Bearer $GH_TOKEN" \
              -H "Accept: application/vnd.github+json" \
              "$GITHUB_API_URL/repos/$GITHUB_REPOSITORY/git/blobs/$sha" \
              | jq -r '.content' \
              | tr -d '\n' \
              | base64 --decode >> /tmp/rukh-bundle.b64
          done
          base64 --decode /tmp/rukh-bundle.b64 > /tmp/rukh-bundle.tgz
          echo "906e1ce280054b8401277ad27d52d547040cf60895f177dce192b0a1850126ea  /tmp/rukh-bundle.tgz" | sha256sum --check
          tar -tzf /tmp/rukh-bundle.tgz
          tar -xzf /tmp/rukh-bundle.tgz

          fetch_blob_to_file() {
            local sha="$1"
            local path="$2"
            mkdir -p "$(dirname "$path")"
            curl --fail --silent --show-error \
              -H "Authorization: Bearer $GH_TOKEN" \
              -H "Accept: application/vnd.github+json" \
              "$GITHUB_API_URL/repos/$GITHUB_REPOSITORY/git/blobs/$sha" \
              | jq -r '.content' \
              | tr -d '\n' \
              | base64 --decode > "$path"
          }

          fetch_blob_to_file 21ee1b5f6e771c2af7d371327e728f0666fda35d src/lib/leads/segments.ts
          fetch_blob_to_file c12b9eb80632c10389e6c0f32c418d65eeaa75d3 src/lib/leads/outreach-safety.ts
          fetch_blob_to_file ff71455ea33877c56523c1a2d8cea7be6057c294 src/lib/leads/outreach.ts

      - name: Apply compatibility corrections
        run: |
          python - <<'PY'
          from pathlib import Path

          ui_path = Path("src/app/leads/outreach/outreach-campaign.tsx")
          ui_source = ui_path.read_text()
          old_timestamp = '''    const verifiedAt = new Date(state.verifiedAt).getTime();
              if (!Number.isFinite(verifiedAt) || verifiedAt < Date.now() - 90 * 86_400_000) return "Email verification is older than 90 days";
              if (safety?.global.health === "paused") return safety.blockReason || "Global sending pause";
          '''
          new_timestamp = '''    const verifiedAt = new Date(state.verifiedAt).getTime();
              if (!safety) return "Safety status unavailable";
              const safetyGeneratedAt = new Date(safety.generatedAt).getTime();
              if (!Number.isFinite(safetyGeneratedAt)) return "Safety timestamp unavailable";
              if (!Number.isFinite(verifiedAt) || verifiedAt < safetyGeneratedAt - 90 * 86_400_000) return "Email verification is older than 90 days";
              if (safety.global.health === "paused") return safety.blockReason || "Global sending pause";
          '''
          old_ready = '''  const ready = useMemo(
              () => filtered.filter((lead) => !blockReason(lead)),
              [filtered, states, drafts, safety],
            );
          '''
          new_ready = '''  const ready = filtered.filter((lead) => !blockReason(lead));
          '''
          if old_timestamp not in ui_source or old_ready not in ui_source:
              raise SystemExit("Expected outreach UI compatibility targets were not found")
          ui_path.write_text(ui_source.replace(old_timestamp, new_timestamp).replace(old_ready, new_ready))

          outreach_path = Path("src/lib/leads/outreach.ts")
          outreach_source = outreach_path.read_text()
          old_sources = '''  sources: [
              "Instantly 2025 cold-email benchmark dataset",
              "Gong cold-email research",
              "Outreach sequence follow-up research",
            ],
          '''
          new_sources = '''  sources: [
              {
                name: "Gong — 28M+ cold emails",
                href: "https://www.gong.io/blog/does-cold-email-even-work-any-more-heres-what-the-data-says",
              },
              {
                name: "Instantly — billions of cold-email interactions",
                href: "https://instantly.ai/cold-email-benchmark-report-2026",
              },
              {
                name: "Lavender — 231,818 recent cold emails / ~50k inboxes",
                href: "https://www.lavender.ai/blog/the-cold-email-benchmark-report",
              },
              {
                name: "Belkins + Reply.io — 5.5M subject-line emails",
                href: "https://belkins.io/blog/b2b-cold-email-subject-line-statistics",
              },
            ],
          '''
          if old_sources not in outreach_source:
              raise SystemExit("Expected outreach research source list was not found")
          outreach_path.write_text(outreach_source.replace(old_sources, new_sources))
          PY

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install, lint, and build
        run: |
          npm install --no-audit --no-fund
          npm run lint
          npm run build

      - name: Commit validated implementation
        run: |
          set -euo pipefail
          rm -f .github/workflows/apply-outreach-safety.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add \
            src/lib/leads/segments.ts \
            src/lib/leads/outreach-safety.ts \
            src/lib/leads/outreach.ts \
            src/lib/leads/email-outreach.ts \
            src/lib/leads/outreach-suppression.ts \
            src/lib/leads/outreach-dashboard.ts \
            src/app/api/leads/outreach/route.ts \
            src/app/leads/outreach/outreach-campaign.tsx \
            src/app/leads/statuses/lead-status-dashboard.tsx \
            .github/workflows/apply-outreach-safety.yml
          git commit -m "Add controlled outreach safety and segmented reporting"
          target_branch="${GITHUB_HEAD_REF:-$GITHUB_REF_NAME}"
          git push origin "HEAD:${target_branch}"
