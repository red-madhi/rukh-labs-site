name: Generate Bluesky OAuth integration

on:
  push:
    branches:
      - feature/bluesky-optional-oauth-follow
    paths:
      - .github/workflows/bluesky-oauth-generate.yml

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out branch
        uses: actions/checkout@v4
        with:
          ref: feature/bluesky-optional-oauth-follow

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install pnpm
        run: npm install --global pnpm@10.28.0

      - name: Add official AT Protocol OAuth packages
        run: pnpm add @atproto/api@0.20.34 @atproto/oauth-client-browser@0.4.9

      - name: Patch explorer result actions
        run: node scripts/patch-bluesky-oauth.mjs

      - name: Lint
        run: pnpm run lint

      - name: Build
        run: pnpm run build

      - name: SEO audit
        run: pnpm run seo:audit

      - name: Commit generated dependency and explorer changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package.json pnpm-lock.yaml src/components/tools/bluesky-network-explorer.tsx src/components/tools/bluesky-following-explorer.tsx
          if git diff --cached --quiet; then
            echo "No generated changes to commit."
          else
            git commit -m "Wire optional Bluesky OAuth into result cards"
            git push origin HEAD:feature/bluesky-optional-oauth-follow
          fi
