name: Rukh Leads Power BI Fresh Jobs

on:
  schedule:
    - cron: "19 6,18 * * *"
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

env:
  GATEWAY_URL: https://rukhlabs.com/api/github-crawl-v2

jobs:
  powerbi-web:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - name: Scan fresh Power BI web and job-board opportunities
        run: |
          TOKEN=$(curl -fsS -H "Authorization: bearer $ACTIONS_ID_TOKEN_REQUEST_TOKEN" "${ACTIONS_ID_TOKEN_REQUEST_URL}&audience=rukhlabs.com" | jq -r .value)
          test -n "$TOKEN" -a "$TOKEN" != "null"
          curl -fsS --retry 2 --retry-delay 2 --max-time 55 -H "Authorization: Bearer $TOKEN" "$GATEWAY_URL?stage=powerbi-web"
