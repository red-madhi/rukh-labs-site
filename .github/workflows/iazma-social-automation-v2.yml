name: IAZMA Social Automation v2

on:
  schedule:
    # Offset from the busiest top-of-hour window. Server endpoints own their
    # Denver-time due checks and daily idempotency, so each tick is a safe
    # catch-up opportunity.
    - cron: "2-57/5 * * * *"
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - ".github/workflows/iazma-social-automation-v2.yml"

permissions:
  contents: read
  id-token: write

concurrency:
  group: iazma-social-automation-v2
  cancel-in-progress: false

jobs:
  follower-sync:
    name: Follower sync
    runs-on: ubuntu-latest
    timeout-minutes: 4
    steps:
      - name: Check for new followers
        run: |
          curl --fail --silent --show-error --retry 3 --retry-delay 5 \
            --max-time 90 \
            https://rukhlabs.com/api/advanced-network/follower-sync >/dev/null

  weekly-thanks:
    name: Weekly thanks
    runs-on: ubuntu-latest
    timeout-minutes: 4
    steps:
      - name: Run Monday thank-you check
        run: |
          curl --fail --silent --show-error --retry 3 --retry-delay 5 \
            --max-time 90 \
            https://rukhlabs.com/api/advanced-network/weekly-thanks >/dev/null

  social-actions:
    name: ${{ matrix.name }}
    runs-on: ubuntu-latest
    timeout-minutes: 4
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Daily boost preparation
            url: https://rukhlabs.com/api/advanced-network/daily-boosts/prepare
          - name: Drop Site repost
            url: https://rukhlabs.com/api/advanced-network/dropsite-daily
          - name: Fight Back News repost
            url: https://rukhlabs.com/api/advanced-network/fightback-daily
          - name: Dev project reposts
            url: https://rukhlabs.com/api/advanced-network/dev-project-daily?catchup=1
    steps:
      - name: Request GitHub OIDC token
        id: oidc
        run: |
          TOKEN=$(curl -fsS \
            -H "Authorization: bearer $ACTIONS_ID_TOKEN_REQUEST_TOKEN" \
            "${ACTIONS_ID_TOKEN_REQUEST_URL}&audience=rukhlabs.com" | jq -r .value)
          test -n "$TOKEN" -a "$TOKEN" != "null"
          echo "token=$TOKEN" >> "$GITHUB_OUTPUT"

      - name: Run ${{ matrix.name }}
        env:
          OIDC_TOKEN: ${{ steps.oidc.outputs.token }}
          TARGET_URL: ${{ matrix.url }}
        run: |
          set -euo pipefail
          for attempt in 1 2 3 4 5 6; do
            if RESPONSE=$(curl --fail --silent --show-error \
              --max-time 90 \
              -H "Authorization: Bearer $OIDC_TOKEN" \
              "$TARGET_URL"); then
              printf '%s\n' "$RESPONSE"
              exit 0
            fi
            if [ "$attempt" -lt 6 ]; then
              sleep 15
            fi
          done
          exit 1
