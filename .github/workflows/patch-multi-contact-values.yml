name: Apply multi-contact value fix

on:
  push:
    branches:
      - fix/multi-contact-values
    paths:
      - scripts/patch-multi-contact-values.mjs
      - .github/workflows/patch-multi-contact-values.yml

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/multi-contact-values
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Apply contact normalization patches
        run: node scripts/patch-multi-contact-values.mjs
      - name: Remove one-shot patch files
        run: rm scripts/patch-multi-contact-values.mjs .github/workflows/patch-multi-contact-values.yml
      - name: Commit patched application
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Handle multiple emails and websites safely"
          git push origin HEAD:fix/multi-contact-values
