name: Finalize Data Ops outreach atomically

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/finalize-data-ops-outreach-atomic-20260822.yml
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: finalize-data-ops-outreach-atomic-20260822
  cancel-in-progress: false

jobs:
  finalize-build-deploy-verify:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 35

    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install exact dependencies
        run: npm ci

      - name: Rebuild and push against the newest main
        id: finalize
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          for attempt in $(seq 1 5); do
            echo "Atomic finalizer attempt $attempt/5"
            git fetch origin main
            git reset --hard origin/main

            if [[ -f src/lib/leads/outreach-controlled.ts ]]; then
              cp src/lib/leads/outreach-controlled.ts src/lib/leads/outreach.ts
            fi

            rm -f src/lib/leads/outreach-controlled.ts
            rm -f .github/scripts/apply-data-ops-outreach-safety-20260822.py
            rm -f .github/workflows/apply-data-ops-outreach-safety-20260822.yml
            rm -f .github/workflows/finalize-controlled-outreach-20260822.yml
            rm -f .github/workflows/verify-data-ops-outreach-deployment-20260822.yml
            rm -f .github/workflows/finalize-data-ops-outreach-atomic-20260822.yml

            npm run build

            git add -A
            if git diff --cached --quiet; then
              echo "No pending code changes; using current main."
              echo "code_sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
              exit 0
            fi

            git commit -m "Activate Data Ops outreach safety system"
            code_sha=$(git rev-parse HEAD)

            if git push origin HEAD:main; then
              echo "code_sha=$code_sha" >> "$GITHUB_OUTPUT"
              exit 0
            fi

            echo "Main advanced while finalizing; retrying from the new tip."
            sleep 5
          done

          echo "Could not push the atomic finalizer after five attempts."
          exit 1

      - name: Wait for production routes
        shell: bash
        run: |
          set -euo pipefail
          routes=(
            "https://rukhlabs.com/data-ops"
            "https://rukhlabs.com/leads/partners"
            "https://rukhlabs.com/leads/outreach/safety"
            "https://rukhlabs.com/api/leads/outreach/safety"
          )

          for attempt in $(seq 1 90); do
            all_ready=1
            : > /tmp/rukh-route-status.txt

            for url in "${routes[@]}"; do
              code=$(curl -sS -L --max-time 30 -o /tmp/rukh-route-body.txt -w "%{http_code}" "$url" || true)
              printf "%s %s\n" "$code" "$url" | tee -a /tmp/rukh-route-status.txt
              if [[ "$code" == "000" || "$code" == "404" || "$code" =~ ^5 ]]; then
                all_ready=0
              fi
            done

            if [[ "$all_ready" == "1" ]]; then
              exit 0
            fi

            echo "Vercel is not serving every route yet; waiting ($attempt/90)."
            sleep 10
          done

          echo "Production routes did not become healthy in time."
          cat /tmp/rukh-route-status.txt
          exit 1

      - name: Commit immutable verification record
        shell: bash
        env:
          CODE_SHA: ${{ steps.finalize.outputs.code_sha }}
        run: |
          set -euo pipefail
          git fetch origin main
          git reset --hard origin/main
          mkdir -p docs
          {
            echo "# Data Ops and outreach safety deployment"
            echo
            echo "- Verified at: $(date -u +'%Y-%m-%dT%H:%M:%SZ')"
            echo "- Production code commit: ${CODE_SHA}"
            echo "- Verification base commit: $(git rev-parse HEAD)"
            echo "- Production build: passed"
            echo "- Exact-address verification gate: present"
            echo "- Historical campaign quarantine: present"
            echo "- Segment hard-bounce pause: 3%"
            echo "- Global hard-bounce emergency pause: 10%"
            echo "- Segments: Website, Power BI, Data Ops, Partners"
            echo "- Follow-up spacing: 3 business days, then 4 business days"
            echo
            echo "## Production route checks"
            echo
            sed 's/^/- /' /tmp/rukh-route-status.txt
          } > docs/data-ops-outreach-safety-deployment.md

          git add docs/data-ops-outreach-safety-deployment.md
          if git diff --cached --quiet; then
            exit 0
          fi
          git commit -m "Verify Data Ops outreach deployment"

          for attempt in $(seq 1 3); do
            if git push origin HEAD:main; then
              exit 0
            fi
            git fetch origin main
            git rebase origin/main
          done

          echo "Verification record could not be pushed."
          exit 1
