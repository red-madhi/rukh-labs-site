name: Rukh Leads IRS Nonprofit Ingestion

on:
  schedule:
    - cron: "23 2 * * *"
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

concurrency:
  group: rukh-leads-irs-nonprofits
  cancel-in-progress: false

jobs:
  ingest:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: Stream official IRS nonprofit data into Rukh Leads
        env:
          LEADS_BASE_URL: https://rukhlabs.com
          IRS_MAX_CANDIDATES: "1500"
          IRS_RECENT_MONTHS: "60"
        run: python3 scripts/leads/run_irs_nonprofits_oidc.py
