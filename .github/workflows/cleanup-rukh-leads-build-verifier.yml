name: Cleanup one-time Rukh Leads build verifier

on:
  push:
    paths:
      - ".github/workflows/cleanup-rukh-leads-build-verifier.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  cleanup:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - name: Remove one-time verification workflows
        run: |
          git rm --ignore-unmatch \
            .github/workflows/verify-rukh-leads-build.yml \
            .github/workflows/cleanup-rukh-leads-build-verifier.yml
          if git diff --cached --quiet; then
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "Clean up Rukh Leads build verifier"
          git push origin HEAD:main
