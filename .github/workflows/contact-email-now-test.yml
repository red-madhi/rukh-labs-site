name: One-time contact email test now

on:
  push:
    paths:
      - ".github/workflows/contact-email-now-test.yml"

jobs:
  verify-contact-email:
    runs-on: ubuntu-latest
    steps:
      - name: Submit controlled production lead
        shell: bash
        run: |
          set -euo pipefail
          response=$(curl --fail-with-body -sS -X POST 'https://rukhlabs.com/api/contact' \
            -H 'Origin: https://rukhlabs.com' \
            -H 'Content-Type: application/json' \
            --data '{"name":"Rukh Labs Live Email Test","email":"test-contact-now@rukhlabs.com","reason":"Something else","message":"Controlled live verification of immediate Rukh Labs contact email notification after Resend domain verification.","sourcePage":"/contact","referrer":"","utm":{}}')
          echo "API_RESPONSE=$response"
          echo "$response" | grep -q '"notificationSent":true'
