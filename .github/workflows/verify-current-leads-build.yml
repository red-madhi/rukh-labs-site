name: Verify current Rukh Leads build

on:
  push:
    branches: [main]
    paths:
      - "src/app/api/leads/**"
      - "src/app/api/github-crawl-v2/**"
      - "src/app/leads/**"
      - "src/lib/leads/**"
      - ".github/workflows/rukh-leads-*.yml"
      - ".github/workflows/verify-current-leads-build.yml"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: verify-current-rukh-leads-build
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm install --no-audit --no-fund
      - run: npm run build
      - name: Record the exact verified source commit
        run: |
          VERIFIED_SHA=$(git rev-parse HEAD)
          printf 'Verified Rukh Leads production-source build\nsource_commit=%s\nverified_at=%s\n' "$VERIFIED_SHA" "$(date -u +%FT%TZ)" > .github/rukh-leads-current-build-verified.txt
          git add .github/rukh-leads-current-build-verified.txt
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "Record verified Rukh Leads build" || exit 0
          git push origin HEAD:main
