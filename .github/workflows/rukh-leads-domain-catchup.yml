name: Rukh Leads Domain Catch-up

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/rukh-leads-domain-catchup.yml"
  schedule:
    - cron: "7,17,27,37,47,57 * * * *"
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

concurrency:
  group: rukh-leads-domain-catchup
  cancel-in-progress: false

env:
  GATEWAY_URL: https://rukhlabs.com/api/github-crawl-v2

jobs:
  discover:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - name: Resolve queued business websites
        run: |
          TOKEN=$(curl -fsS -H "Authorization: bearer $ACTIONS_ID_TOKEN_REQUEST_TOKEN" "${ACTIONS_ID_TOKEN_REQUEST_URL}&audience=rukhlabs.com" | jq -r .value)
          test -n "$TOKEN" -a "$TOKEN" != "null"
          curl -fsS --retry 2 --retry-delay 2 --max-time 55 -H "Authorization: Bearer $TOKEN" "$GATEWAY_URL?stage=discover"
