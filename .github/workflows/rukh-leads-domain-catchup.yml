name: Rukh Leads Domain Catch-up

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/rukh-leads-domain-catchup.yml"
  schedule:
    - cron: "7,17,27,37,47,57 * * * *"
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

concurrency:
  group: rukh-leads-domain-catchup
  cancel-in-progress: false

env:
  GATEWAY_URL: https://rukhlabs.com/api/github-crawl-v2

jobs:
  discover:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - name: Resolve queued websites without wasting search budget
        run: |
          TOKEN=$(curl -fsS -H "Authorization: bearer $ACTIONS_ID_TOKEN_REQUEST_TOKEN" "${ACTIONS_ID_TOKEN_REQUEST_URL}&audience=rukhlabs.com" | jq -r .value)
          test -n "$TOKEN" -a "$TOKEN" != "null"

          BODY=$(mktemp)
          STATUS=$(curl -sS --retry 1 --max-time 55 -o "$BODY" -w "%{http_code}" -H "Authorization: Bearer $TOKEN" "$GATEWAY_URL?stage=discover-free" || true)
          if [ "$STATUS" -ge 200 ] && [ "$STATUS" -lt 300 ]; then
            cat "$BODY"
            exit 0
          fi

          # During a deployment-rate-limit window the currently serving gateway may
          # predate discover-free. Keep the older paid resolver alive only once every
          # two hours instead of spending Brave requests every 10 minutes. As soon as
          # discover-free is deployed, the branch above takes over automatically.
          MINUTE=$(date -u +%M)
          HOUR=$(date -u +%H)
          if [ "$MINUTE" = "07" ] && [ $((10#$HOUR % 2)) -eq 0 ]; then
            curl -fsS --retry 2 --retry-delay 2 --max-time 55 -H "Authorization: Bearer $TOKEN" "$GATEWAY_URL?stage=discover"
            exit 0
          fi

          echo "Free domain resolver is not deployed yet (HTTP $STATUS); paid fallback intentionally skipped on this tick."
