name: CI

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies
        run: npm install --no-audit --no-fund

      - name: Build
        id: build
        run: npm run build

      - name: Check Job Cannon extension syntax
        run: npm run check:job-cannon-extension

      - name: Lint Glass Squares changes
        run: npx eslint src/app/products/glass-squares-os/page.tsx src/app/products/glass-squares-os/opengraph-image.tsx src/lib/products.ts src/lib/seo-routes.ts scripts/verify-glass-page.mjs

      - name: Lint
        run: npm run lint

      # Keep repository-wide failures visible, while collecting independent page evidence.
      - name: SEO audit
        if: ${{ !cancelled() && steps.build.outcome == 'success' }}
        run: npm run seo:audit

      - name: Install isolated browser test tooling
        id: browser_tools
        if: ${{ !cancelled() && steps.build.outcome == 'success' }}
        run: |
          npm install --prefix "$RUNNER_TEMP/glass-browser" playwright@1.55.1 --no-audit --no-fund
          "$RUNNER_TEMP/glass-browser/node_modules/.bin/playwright" install --with-deps chromium

      - name: Verify Glass Squares public page
        if: ${{ !cancelled() && steps.browser_tools.outcome == 'success' }}
        env:
          NEXT_TELEMETRY_DISABLED: "1"
        run: GLASS_BROWSER_MODULES="$RUNNER_TEMP/glass-browser/node_modules" node scripts/verify-glass-page.mjs

      - name: Retain Glass Squares browser evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: glass-squares-page-evidence
          path: artifacts/glass-page
          if-no-files-found: ignore
          retention-days: 7
