name: One-shot IAZMA PRO lint repair

on:
  push:
    branches:
      - feat/iazma-pro-guided-network-story

permissions:
  contents: write

jobs:
  repair:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Check out branch
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Apply targeted React lint repairs
        shell: bash
        run: |
          echo '' | base64 --decode | gzip --decompress > /tmp/iazma_repair.py
          python /tmp/iazma_repair.py
          git diff --check

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies
        run: npm install --no-audit --no-fund

      - name: Verify lint
        run: npm run lint

      - name: Commit repairs
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Fix IAZMA PRO React lint issues"
          git push origin HEAD:${GITHUB_REF_NAME}
