name: One-shot IAZMA PRO lint repair

on:
  push:
    branches:
      - feat/iazma-pro-guided-network-story

permissions:
  contents: write

jobs:
  repair:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Check out branch
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Apply targeted React lint repairs
        shell: bash
        run: |
          python <<'PY'
          from pathlib import Path

          def replace(path: str, old: str, new: str, expected: int = 1) -> None:
              file = Path(path)
              text = file.read_text(encoding="utf-8")
              found = text.count(old)
              if found != expected:
                  raise SystemExit(f"{path}: expected {expected} occurrence(s), found {found}: {old[:90]!r}")
              file.write_text(text.replace(old, new), encoding="utf-8")
              print(f"updated {path}")

          replace(
              "src/components/tools/advanced-network-action-center.tsx",
              '''  useEffect(() => {
            if (!connected) {
              setData(null);
              return;
            }
            void load();
            // eslint-disable-next-line react-hooks/exhaustive-deps
          }, [connected, oauth.did, runId]);''',
              '''  useEffect(() => {
            const frame = window.requestAnimationFrame(() => {
              if (!connected) {
                setData(null);
                return;
              }
              void load();
            });
            return () => window.cancelAnimationFrame(frame);
            // eslint-disable-next-line react-hooks/exhaustive-deps
          }, [connected, oauth.did, runId]);''',
          )

          replace(
              "src/components/tools/advanced-network-dashboard.tsx",
              '''  useEffect(() => {
            if (!storageKey) return;
            try {
              const saved = JSON.parse(window.localStorage.getItem(storageKey) ?? "null") as {
                mode?: AdvancedTargetMode;
                targetText?: string;
                categories?: string[];
              } | null;
              if (saved?.mode) {
                setMode(saved.mode === "profiles" || saved.mode === "hybrid" ? "profiles" : "suggested");
              }
              if (typeof saved?.targetText === "string") setTargetText(saved.targetText);
              if (Array.isArray(saved?.categories)) setCategories(saved.categories);
            } catch {
              // Ignore malformed drafts.
            }
          }, [storageKey]);''',
              '''  useEffect(() => {
            if (!storageKey) return;
            const frame = window.requestAnimationFrame(() => {
              try {
                const saved = JSON.parse(window.localStorage.getItem(storageKey) ?? "null") as {
                  mode?: AdvancedTargetMode;
                  targetText?: string;
                  categories?: string[];
                } | null;
                if (saved?.mode) {
                  setMode(saved.mode === "profiles" || saved.mode === "hybrid" ? "profiles" : "suggested");
                }
                if (typeof saved?.targetText === "string") setTargetText(saved.targetText);
                if (Array.isArray(saved?.categories)) setCategories(saved.categories);
              } catch {
                // Ignore malformed drafts.
              }
            });
            return () => window.cancelAnimationFrame(frame);
          }, [storageKey]);''',
          )

          refresh_effect_old = '''  useEffect(() => {
            void refresh();
          }, [refresh]);'''
          refresh_effect_new = '''  useEffect(() => {
            const frame = window.requestAnimationFrame(() => void refresh());
            return () => window.cancelAnimationFrame(frame);
          }, [refresh]);'''
          for path in (
              "src/components/tools/advanced-network-explore-map-mobile.tsx",
              "src/components/tools/advanced-network-explore-map-v2.tsx",
              "src/components/tools/advanced-network-explore-map-v3.tsx",
              "src/components/tools/advanced-network-explore-map-v4.tsx",
              "src/components/tools/advanced-network-explore-map.tsx",
          ):
              replace(path, refresh_effect_old, refresh_effect_new)

          for path in (
              "src/components/tools/advanced-network-explore-map-mobile.tsx",
              "src/components/tools/advanced-network-explore-map-v2.tsx",
              "src/components/tools/advanced-network-explore-map-v3.tsx",
          ):
              replace(
                  path,
                  'style={{ touchAction: "none", cursor: pointersRef.current.size ? "grabbing" : "grab" }}',
                  'style={{ touchAction: "none", cursor: "grab" }}',
              )

          replace(
              "src/components/tools/advanced-network-explore-map.tsx",
              'style={{ cursor: dragRef.current ? "grabbing" : "grab" }}',
              'style={{ cursor: "grab" }}',
          )

          replace(
              "src/components/tools/advanced-network-follow-button.tsx",
              'import { useEffect, useState } from "react";',
              'import { useState } from "react";',
          )
          replace(
              "src/components/tools/advanced-network-follow-button.tsx",
              '''  const [state, setState] = useState<FollowState>(following ? "followed" : "idle");
            const [error, setError] = useState("");

            useEffect(() => {
              if (following) setState("followed");
            }, [following]);''',
              '''  const [localState, setState] = useState<FollowState>(following ? "followed" : "idle");
            const [error, setError] = useState("");
            const state: FollowState = following ? "followed" : localState;''',
          )
          replace(
              "src/components/tools/advanced-network-follow-button.tsx",
              '        title={error || undefined}\n',
              '',
          )

          replace(
              "src/components/tools/advanced-network-live-map.tsx",
              '''  useEffect(() => {
            if (!connected || !oauth.did) {
              setGraph(null);
              return;
            }
            void refresh();
          }, [connected, oauth.did, refresh]);''',
              '''  useEffect(() => {
            const frame = window.requestAnimationFrame(() => {
              if (!connected || !oauth.did) {
                setGraph(null);
                return;
              }
              void refresh();
            });
            return () => window.cancelAnimationFrame(frame);
          }, [connected, oauth.did, refresh]);''',
          )

          replace(
              "src/components/tools/advanced-network-strategy-panel.tsx",
              '  CheckCircle2,\n',
              '',
          )
          replace(
              "src/components/tools/advanced-network-strategy-panel.tsx",
              '''  useEffect(() => {
            if (!connected) {
              setData(null);
              return;
            }
            void load();
            const interval = window.setInterval(() => void load(), 30_000);
            return () => window.clearInterval(interval);
          }, [connected, load]);''',
              '''  useEffect(() => {
            let interval: number | undefined;
            const frame = window.requestAnimationFrame(() => {
              if (!connected) {
                setData(null);
                return;
              }
              void load();
              interval = window.setInterval(() => void load(), 30_000);
            });
            return () => {
              window.cancelAnimationFrame(frame);
              if (interval !== undefined) window.clearInterval(interval);
            };
          }, [connected, load]);''',
          )
          replace(
              "src/components/tools/advanced-network-strategy-panel.tsx",
              "not today's engagement assignments",
              "not today&apos;s engagement assignments",
          )

          replace(
              "src/components/tools/advanced-network-explain.tsx",
              '  useEffect(() => setMounted(true), []);',
              '''  useEffect(() => {
            const frame = window.requestAnimationFrame(() => setMounted(true));
            return () => window.cancelAnimationFrame(frame);
          }, []);''',
          )

          replace(
              "src/components/tools/advanced-network-explore-panel.tsx",
              '''  useEffect(() => {
            if (!oauth.did) return;
            setScope(readScope(oauth.did));

            const onScope = (event: Event) => {
              const custom = event as CustomEvent<{ did?: string; scope?: StartingNetworkScope }>;
              if (custom.detail?.did !== oauth.did) return;
              const next = custom.detail.scope;
              if (next === "all-followers" || next === "mutuals-only") setScope(next);
            };

            window.addEventListener("rukh:advanced-network:scope-change", onScope);
            return () => window.removeEventListener("rukh:advanced-network:scope-change", onScope);
          }, [oauth.did]);''',
              '''  useEffect(() => {
            if (!oauth.did) return;
            const frame = window.requestAnimationFrame(() => setScope(readScope(oauth.did)));

            const onScope = (event: Event) => {
              const custom = event as CustomEvent<{ did?: string; scope?: StartingNetworkScope }>;
              if (custom.detail?.did !== oauth.did) return;
              const next = custom.detail.scope;
              if (next === "all-followers" || next === "mutuals-only") setScope(next);
            };

            window.addEventListener("rukh:advanced-network:scope-change", onScope);
            return () => {
              window.cancelAnimationFrame(frame);
              window.removeEventListener("rukh:advanced-network:scope-change", onScope);
            };
          }, [oauth.did]);''',
          )

          replace(
              "src/components/tools/advanced-network-fit-panel.tsx",
              '''  useEffect(() => {
            if (!connected) {
              setItems([]);
              return;
            }
            void load();
          }, [connected, load]);''',
              '''  useEffect(() => {
            const frame = window.requestAnimationFrame(() => {
              if (!connected) {
                setItems([]);
                return;
              }
              void load();
            });
            return () => window.cancelAnimationFrame(frame);
          }, [connected, load]);''',
          )
          replace(
              "src/components/tools/advanced-network-fit-panel.tsx",
              "person's work",
              "person&apos;s work",
          )

          replace(
              "src/components/tools/advanced-network-goal.tsx",
              '''  useEffect(() => {
            const saved = normalizeNetworkGoal(window.localStorage.getItem(STORAGE_KEY));
            setGoal(saved);
            saveGoal(saved);
          }, []);''',
              '''  useEffect(() => {
            const saved = normalizeNetworkGoal(window.localStorage.getItem(STORAGE_KEY));
            saveGoal(saved);
            const frame = window.requestAnimationFrame(() => setGoal(saved));
            return () => window.cancelAnimationFrame(frame);
          }, []);''',
          )

          replace(
              "src/components/tools/advanced-network-learning-system.tsx",
              '''  useEffect(() => {
            const done = window.localStorage.getItem(STORAGE_KEY) === "complete";
            setCompleted(done);
            if (done) setExpanded(false);
          }, []);''',
              '''  useEffect(() => {
            const done = window.localStorage.getItem(STORAGE_KEY) === "complete";
            const frame = window.requestAnimationFrame(() => {
              setCompleted(done);
              if (done) setExpanded(false);
            });
            return () => window.cancelAnimationFrame(frame);
          }, []);''',
          )

          replace(
              "src/components/tools/advanced-network-progress.tsx",
              '''  useEffect(() => {
            if (!connected) {
              setProgress(null);
              setError("");
              setSelectedChart(null);
              return;
            }
            void refresh();
          }, [connected, refresh]);''',
              '''  useEffect(() => {
            const frame = window.requestAnimationFrame(() => {
              if (!connected) {
                setProgress(null);
                setError("");
                setSelectedChart(null);
                return;
              }
              void refresh();
            });
            return () => window.cancelAnimationFrame(frame);
          }, [connected, refresh]);''',
          )

          replace(
              "src/components/tools/advanced-network-starting-scope.tsx",
              '''  useEffect(() => {
            if (!storageKey) return;
            const saved = window.localStorage.getItem(storageKey);
            if (saved === "all-followers" || saved === "mutuals-only") {
              setScope(saved);
            }
          }, [storageKey]);''',
              '''  useEffect(() => {
            if (!storageKey) return;
            const saved = window.localStorage.getItem(storageKey);
            if (saved !== "all-followers" && saved !== "mutuals-only") return;
            const frame = window.requestAnimationFrame(() => setScope(saved));
            return () => window.cancelAnimationFrame(frame);
          }, [storageKey]);''',
          )

          Path(".github/workflows/iazma-pro-lint-autofix.yml").unlink()
          print("removed one-shot workflow")
          PY

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies
        run: npm install --no-audit --no-fund

      - name: Verify lint
        run: npm run lint

      - name: Commit repairs
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Fix IAZMA PRO React lint issues"
          git push origin HEAD:${GITHUB_REF_NAME}
