name: Rukh Leads Power BI Adoption Signals

on:
  schedule:
    - cron: "37 */12 * * *"
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

concurrency:
  group: rukh-leads-powerbi-adoption
  cancel-in-progress: false

env:
  GATEWAY_URL: https://rukhlabs.com/api/github-crawl-v2

jobs:
  adoption:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - name: Find company-owned Power BI and Fabric hiring signals
        run: |
          TOKEN=$(curl -fsS -H "Authorization: bearer $ACTIONS_ID_TOKEN_REQUEST_TOKEN" "${ACTIONS_ID_TOKEN_REQUEST_URL}&audience=rukhlabs.com" | jq -r .value)
          test -n "$TOKEN" -a "$TOKEN" != "null"
          curl -fsS --retry 2 --retry-delay 2 --max-time 55 -H "Authorization: Bearer $TOKEN" "$GATEWAY_URL?stage=powerbi-adoption"
