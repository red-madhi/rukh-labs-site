name: Retire obsolete secret-dependent Rukh Leads scheduler

on:
  push:
    paths:
      - ".github/workflows/cleanup-obsolete-rukh-leads-scheduler.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  cleanup:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - name: Remove obsolete scheduler
        run: |
          git rm --ignore-unmatch .github/workflows/rukh-leads-scheduler.yml
          if git diff --cached --quiet; then
            echo "Obsolete scheduler is already gone."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "Retire secret-dependent Rukh Leads scheduler"
          git push origin HEAD:main
