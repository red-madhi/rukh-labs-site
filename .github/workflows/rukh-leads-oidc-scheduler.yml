name: Rukh Leads OIDC Scheduler

on:
  schedule:
    - cron: "3,13,23,33,43,53 * * * *"
    - cron: "8,38 * * * *"
    - cron: "17 * * * *"
    - cron: "27 */4 * * *"
    - cron: "41 */6 * * *"
    - cron: "52 11 * * *"
  workflow_dispatch:
    inputs:
      source:
        description: "Collector to run"
        required: true
        default: "all"
        type: choice
        options:
          - all
          - bluesky
          - web
          - inbound
          - directories
          - enrich

permissions:
  contents: read
  id-token: write

concurrency:
  group: rukh-leads-oidc-${{ github.event_name }}-${{ github.event.schedule || inputs.source || 'manual' }}
  cancel-in-progress: false

env:
  GATEWAY_URL: https://rukhlabs.com/api/github-crawl

jobs:
  bluesky:
    if: >-
      github.event_name == 'schedule' && github.event.schedule == '3,13,23,33,43,53 * * * *' ||
      github.event_name == 'workflow_dispatch' && (inputs.source == 'bluesky' || inputs.source == 'all')
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - name: Request short-lived GitHub OIDC token and scan Bluesky
        run: |
          TOKEN=$(curl -fsS -H "Authorization: bearer $ACTIONS_ID_TOKEN_REQUEST_TOKEN" \
            "${ACTIONS_ID_TOKEN_REQUEST_URL}&audience=rukhlabs.com" | jq -r .value)
          test -n "$TOKEN" -a "$TOKEN" != "null"
          curl -fsS --retry 2 --retry-delay 2 --max-time 55 \
            -H "Authorization: Bearer $TOKEN" "$GATEWAY_URL?stage=bluesky"

  inbound:
    if: >-
      github.event_name == 'schedule' && github.event.schedule == '8,38 * * * *' ||
      github.event_name == 'workflow_dispatch' && (inputs.source == 'inbound' || inputs.source == 'all')
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - name: Request short-lived GitHub OIDC token and sync inbound leads
        run: |
          TOKEN=$(curl -fsS -H "Authorization: bearer $ACTIONS_ID_TOKEN_REQUEST_TOKEN" \
            "${ACTIONS_ID_TOKEN_REQUEST_URL}&audience=rukhlabs.com" | jq -r .value)
          test -n "$TOKEN" -a "$TOKEN" != "null"
          curl -fsS --retry 2 --retry-delay 2 --max-time 55 \
            -H "Authorization: Bearer $TOKEN" "$GATEWAY_URL?stage=inbound"

  enrich:
    if: >-
      github.event_name == 'schedule' && github.event.schedule == '17 * * * *' ||
      github.event_name == 'workflow_dispatch' && (inputs.source == 'enrich' || inputs.source == 'all')
    runs-on: ubuntu-latest
    timeout-minutes: 4
    steps:
      - name: Request short-lived GitHub OIDC token and enrich candidates
        run: |
          TOKEN=$(curl -fsS -H "Authorization: bearer $ACTIONS_ID_TOKEN_REQUEST_TOKEN" \
            "${ACTIONS_ID_TOKEN_REQUEST_URL}&audience=rukhlabs.com" | jq -r .value)
          test -n "$TOKEN" -a "$TOKEN" != "null"
          curl -fsS --retry 2 --retry-delay 2 --max-time 55 \
            -H "Authorization: Bearer $TOKEN" "$GATEWAY_URL?stage=enrich"

  public-web:
    if: >-
      github.event_name == 'schedule' && github.event.schedule == '27 */4 * * *' ||
      github.event_name == 'workflow_dispatch' && (inputs.source == 'web' || inputs.source == 'all')
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - name: Request short-lived GitHub OIDC token and scan public web intent
        run: |
          TOKEN=$(curl -fsS -H "Authorization: bearer $ACTIONS_ID_TOKEN_REQUEST_TOKEN" \
            "${ACTIONS_ID_TOKEN_REQUEST_URL}&audience=rukhlabs.com" | jq -r .value)
          test -n "$TOKEN" -a "$TOKEN" != "null"
          curl -fsS --retry 2 --retry-delay 2 --max-time 55 \
            -H "Authorization: Bearer $TOKEN" "$GATEWAY_URL?stage=web"

  directories:
    if: >-
      github.event_name == 'schedule' && github.event.schedule == '41 */6 * * *' ||
      github.event_name == 'workflow_dispatch' && (inputs.source == 'directories' || inputs.source == 'all')
    runs-on: ubuntu-latest
    timeout-minutes: 4
    steps:
      - name: Request short-lived GitHub OIDC token and crawl official directories
        run: |
          TOKEN=$(curl -fsS -H "Authorization: bearer $ACTIONS_ID_TOKEN_REQUEST_TOKEN" \
            "${ACTIONS_ID_TOKEN_REQUEST_URL}&audience=rukhlabs.com" | jq -r .value)
          test -n "$TOKEN" -a "$TOKEN" != "null"
          curl -fsS --retry 2 --retry-delay 2 --max-time 55 \
            -H "Authorization: Bearer $TOKEN" "$GATEWAY_URL?stage=directories"

  daily-full-pass:
    if: >-
      github.event_name == 'schedule' && github.event.schedule == '52 11 * * *' ||
      github.event_name == 'workflow_dispatch' && inputs.source == 'all'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Request short-lived GitHub OIDC token and run the full network
        run: |
          TOKEN=$(curl -fsS -H "Authorization: bearer $ACTIONS_ID_TOKEN_REQUEST_TOKEN" \
            "${ACTIONS_ID_TOKEN_REQUEST_URL}&audience=rukhlabs.com" | jq -r .value)
          test -n "$TOKEN" -a "$TOKEN" != "null"
          curl -fsS --retry 2 --retry-delay 2 --max-time 55 \
            -H "Authorization: Bearer $TOKEN" "$GATEWAY_URL?stage=all"
