name: Apply IAZMA Guard production patch

on:
  push:
    paths:
      - ".github/workflows/apply-iazma-guard.yml"

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - name: Apply Guard patch
        shell: bash
        run: |
          python - <<'PY'
          import base64, io, tarfile
          payload = ''''''
          data = base64.b64decode(payload)
          with tarfile.open(fileobj=io.BytesIO(data), mode='r:gz') as tf:
              tf.extractall('.')
          PY
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/lib/iazma-guard-classify.ts src/lib/iazma-guard-server.ts src/app/api/guard/route.ts src/app/guard/page.tsx src/components/tools/iazma-guard-dashboard.tsx src/app/api/advanced-network/follower-sync/route.ts
          git rm .github/workflows/apply-iazma-guard.yml
          git commit -m "feat: deploy IAZMA Guard"
          git push origin HEAD:main
