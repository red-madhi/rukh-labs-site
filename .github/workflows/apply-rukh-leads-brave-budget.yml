name: Apply Rukh Leads Brave request budget

on:
  push:
    paths:
      - ".github/workflows/apply-rukh-leads-brave-budget.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - name: Patch Brave-backed collectors
        run: |
          python3 - <<'PY'
          from pathlib import Path

          budget_import = 'import { BRAVE_MONTHLY_REQUEST_LIMIT, reserveMonthlyApiUsage } from "@/lib/leads/api-budget";\n'

          web = Path('src/app/api/leads/collect/web-intent/route.ts')
          text = web.read_text()
          if budget_import not in text:
              marker = 'import { leadNeonQuery } from "@/lib/leads/neon";\n'
              text = text.replace(marker, marker + budget_import)
          marker = '  const runId = crypto.randomUUID();\n'
          budget_block = '''  const budget = await reserveMonthlyApiUsage(\n    "brave-search",\n    searchConfigs.length,\n    BRAVE_MONTHLY_REQUEST_LIMIT,\n  );\n  if (!budget.allowed) {\n    const message = `Monthly Brave Search budget reached (${budget.limit} requests).`;\n    await leadNeonQuery(\n      `UPDATE public.lead_source_state SET status = 'ready', last_run_at = now(), last_error = $2, updated_at = now() WHERE source_id = $1`,\n      [SOURCE_ID, message],\n    ).catch(() => undefined);\n    return privateJson({ error: message, source: SOURCE_ID, budget }, { status: 429 });\n  }\n\n'''
          if budget_block not in text:
              text = text.replace(marker, budget_block + marker)
          web.write_text(text)

          for path in [
              Path('src/app/api/leads/collect/discover-v2/route.ts'),
              Path('src/app/api/leads/collect/discover-v3/route.ts'),
          ]:
              text = path.read_text()
              if budget_import not in text:
                  marker = 'import { leadNeonQuery, neonRowsToObjects } from "@/lib/leads/neon";\n'
                  text = text.replace(marker, marker + budget_import)
              marker = '    const apiKey = process.env.BRAVE_SEARCH_API_KEY?.trim();\n'
              replacement = '''    const apiKey = process.env.BRAVE_SEARCH_API_KEY?.trim();\n    const budget = apiKey\n      ? await reserveMonthlyApiUsage("brave-search", BRAVE_LIMIT, BRAVE_MONTHLY_REQUEST_LIMIT)\n      : { allowed: false, used: 0, limit: BRAVE_MONTHLY_REQUEST_LIMIT };\n'''
              text = text.replace(marker, replacement)
              text = text.replace(
                  'if (!discovery && apiKey && braveUsed < BRAVE_LIMIT) {',
                  'if (!discovery && apiKey && budget.allowed && braveUsed < BRAVE_LIMIT) {',
              )
              path.write_text(text)
          PY
          git rm .github/workflows/apply-rukh-leads-brave-budget.yml
          git add src/app/api/leads/collect/web-intent/route.ts \
                  src/app/api/leads/collect/discover-v2/route.ts \
                  src/app/api/leads/collect/discover-v3/route.ts
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "Enforce shared monthly Brave Search budget"
          git push origin HEAD:main
